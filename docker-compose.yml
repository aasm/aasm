services:
  aasm:
    image: aasm/aasm
    build: .
    command: bash -c 'bundle exec appraisal install && bundle exec appraisal rspec'
    environment:
      - DYNAMODB_HOST=dynamodb
      - DYNAMODB_PORT=8000
      - MONGODB_HOST=mongo
      - MONGODB_PORT=27017
      - RAILS_ENV=development
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - RETHINKDB_DB=rethinkdb_test
      - RETHINKDB_HOST=rethinkdb
      - RETHINKDB_PORT=28015
    depends_on:
      - dynamodb
      - mongo
      - redis
      - rethinkdb
    volumes:
      - .:/application
      - bundle:/bundle

  dynamodb:
    image: amazon/dynamodb-local:latest

  mongo:
    image: mongo:6.0

  redis:
    image: redis:6-alpine

  rethinkdb:
    image: rethinkdb:2.4

volumes:
  bundle:
